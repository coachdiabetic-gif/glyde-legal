<style>
:root { --ink: #0F172A; --grey: #64748B; --blue: #1D4ED8; --tint: #EEF2FF; --page: #F5F6F8; --card: #FFFFFF; --line: #E5E7EB; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 400 16px/1.6 'DM Sans', system-ui, sans-serif; }
main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
.card { background: var(--card); border-radius: 24px; padding: 32px 24px; box-shadow: 0 6px 20px rgba(0,0,0,0.04); }
header { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; }
header .drop { width: 24px; height: 28px; }
header span { font-weight: 700; font-size: 22px; letter-spacing: -0.4px; }
nav { display: flex; gap: 16px; margin: 0 0 24px; }
nav a { color: var(--blue); font-weight: 600; text-decoration: none; }
h1 { font-size: 32px; line-height: 1.2; letter-spacing: -0.8px; margin: 0 0 8px; }
h2 { font-size: 20px; margin: 32px 0 8px; }
p, li { color: var(--ink); }
em { color: var(--grey); font-style: normal; }
a { color: var(--blue); }
ul { padding-left: 20px; }
hr { border: 0; border-top: 1px solid var(--line); margin: 32px 0; }
table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 15px; }
th, td { text-align: left; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--grey); font-weight: 600; }
footer { color: var(--grey); font-size: 14px; text-align: center; margin-top: 24px; }
@media (max-width: 480px) { .card { padding: 24px 16px; } h1 { font-size: 28px; } table { font-size: 14px; } }
</style>
</head>
